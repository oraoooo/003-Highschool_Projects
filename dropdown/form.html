<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pendaftaran KTP</title>
    <link rel="stylesheet" href="form-style.css">
</head>
<body>
    <div id="navbar-placeholder"></div>
    <script>
        fetch("navbar.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("navbar-placeholder").innerHTML = data;
            });
    </script>
    <div class="form-container">
        <h1>Form Pendaftaran KTP</h1>
        <form>
            <table>
                <tr>
                    <td class="label">Nomor Pendaftaran</td>
                    <td class="colon">:</td>
                    <td><input type="text" name="nomor_pendaftaran" class="input-field" placeholder="Nomor Pendaftaran."></td>
                </tr>
                <tr>
                    <td class="label">Nama</td>
                    <td class="colon">:</td>
                    <td><input type="text" name="nama" class="input-field" placeholder="Nama Anda."></td>
                </tr>
                <tr>
                    <td class="label">Jenis Kelamin</td>
                    <td class="colon">:</td>
                    <td>
                        <input type="radio" name="jenis_kelamin" value="Pria" id="pria">
                        <label for="pria">Pria</label>
                        <input type="radio" name="jenis_kelamin" value="Wanita" id="wanita">
                        <label for="wanita">Wanita</label>
                    </td>
                </tr>
                <tr>
                    <td class="label">Tempat, Tanggal Lahir</td>
                    <td class="colon">:</td>
                    <td><input type="text" name="ttl" class="input-field" placeholder="Kota, DD/MM/YYYY"></td>
                </tr>
                <tr>
                    <td class="label">Pekerjaan</td>
                    <td class="colon">:</td>
                    <td><input type="text" name="pekerjaan" class="input-field" placeholder="Pekerjaan Anda."></td>
                </tr>
                <tr>
                    <td class="label">Status Pernikahan</td>
                    <td class="colon">:</td>
                    <td>
                        <input type="radio" name="status_pernikahan" value="Sudah Menikah" id="sudah">
                        <label for="sudah">Sudah Menikah</label>
                        <input type="radio" name="status_pernikahan" value="Belum Menikah" id="belum">
                        <label for="belum">Belum Menikah</label>
                        <input type="radio" name="status_pernikahan" value="Janda" id="janda">
                        <label for="janda">Janda</label>
                        <input type="radio" name="status_pernikahan" value="Duda" id="duda">
                        <label for="duda">Duda</label>
                    </td>
                </tr>
                <tr>
                    <td class="label">Alamat Rumah</td>
                    <td class="colon">:</td>
                    <td><input type="text" name="alamat" class="input-field" placeholder="Alamat Anda."></td>
                </tr>
                <tr>
                    <td class="label">Agama</td>
                    <td class="colon">:</td>
                    <td>
                        <select name="agama" class="input-field">
                            <option value="">--Pilih Salah Satu Agama--</option>
                            <option value="Islam">Islam</option>
                            <option value="Kristen">Kristen</option>
                            <option value="Katolik">Katolik</option>
                            <option value="Hindu">Hindu</option>
                            <option value="Buddha">Buddha</option>
                            <option value="Konghucu">Konghucu</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td class="label">RT/RW</td>
                    <td class="colon">:</td>
                    <td>
                        RT: <input type="text" name="rt" class="small-input input-field" placeholder="RT."> 
                        RW: <input type="text" name="rw" class="small-input input-field" placeholder="RW.">
                    </td>
                </tr>
                <tr>
                    <td class="label">Kelurahan</td>
                    <td class="colon">:</td>
                    <td><input type="text" name="kelurahan" class="input-field" placeholder="Kelurahan."></td>
                </tr>
                <tr>
                    <td class="label">Kecamatan</td>
                    <td class="colon">:</td>
                    <td><input type="text" name="kecamatan" class="input-field" placeholder="Kecamatan."></td>
                </tr>
                <tr>
                    <td class="label">Kabupaten/Kota</td>
                    <td class="colon">:</td>
                    <td><input type="text" name="kabupaten_kota" class="input-field" placeholder="Kabupaten/Kota."></td>
                </tr>
                <tr>
                    <td class="label">Provinsi</td>
                    <td class="colon">:</td>
                    <td><input type="text" name="provinsi" class="input-field" placeholder="Provinsi."></td>
                </tr>
                <tr>
                    <td class="label">Tanggal Pendaftaran</td>
                    <td class="colon">:</td>
                    <td>
                        Tanggal: <input type="text" name="tanggal" class="small-input input-field" placeholder="..."> 
                        Bulan: <input type="text" name="bulan" class="small-input input-field" placeholder="..."> 
                        Tahun: <input type="text" name="tahun" class="medium-input input-field" placeholder="...">
                    </td>
                </tr>
            </table>
            <div class="form-buttons">
                <input type="submit" value="Submit">
                <input type="reset" value="Reset">
            </div>
        </form>
        <div class="footer">
            Dibuat oleh: IT-3 / 26 / Rainer Evan Rusly
        </div>
    </div>
</body>
</html>
